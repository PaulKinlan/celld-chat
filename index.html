<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>celld chat</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.4 system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        padding: 10px 16px;
        border-bottom: 1px solid #21262d;
        display: flex;
        gap: 12px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      header h1 { font-size: 16px; margin: 0; }
      header .meta { color: #8b949e; font-size: 13px; }
      header .meta b { color: #58a6ff; font-weight: 600; }
      #status { font-size: 13px; padding: 1px 8px; border-radius: 10px; background: #21262d; }
      #status.on { background: #123d22; color: #3fb950; }
      #status.off { background: #4a1219; color: #f85149; }
      #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
      .msg { max-width: 70%; }
      .msg .who { font-size: 12px; color: #58a6ff; }
      .msg .body { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 6px 10px; overflow-wrap: anywhere; }
      .msg.self { align-self: flex-end; text-align: right; }
      .msg.self .who { color: #3fb950; }
      .msg.self .body { background: #12261e; border-color: #1d4428; }
      .sys { color: #8b949e; font-size: 13px; text-align: center; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; }
      #name { width: 130px; }
      input {
        flex: 1;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 8px 12px;
        color: #e6edf3;
        font: inherit;
      }
      input:focus { outline: none; border-color: #58a6ff; }
      button {
        background: #238636;
        border: 0;
        border-radius: 8px;
        padding: 8px 18px;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #2ea043; }
    </style>
  </head>
  <body>
    <header>
      <h1>celld chat</h1>
      <span class="meta">room <b id="room">lobby</b> · node <b id="node">—</b></span>
      <span id="status" class="off">connecting…</span>
      <span class="meta" id="presence"></span>
    </header>
    <div id="msgs"></div>
    <form id="f">
      <input id="name" placeholder="name" maxlength="40" autocomplete="nickname" />
      <input id="text" placeholder="message" maxlength="500" autocomplete="off" />
      <button>send</button>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
